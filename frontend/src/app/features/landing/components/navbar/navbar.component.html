<nav class="navbar" [class.navbar--scrolled]="scrolled" id="main-navbar">
  <div class="navbar__inner">
    <a class="navbar__logo" href="/">
      @if (logoUrl) {
        <img [src]="logoUrl" [alt]="siteName" class="navbar__logo-img" />
      } @else {
        <span class="navbar__logo-text">{{ siteName }}</span>
      }
    </a>

    <ul class="navbar__links" [class.navbar__links--open]="menuOpen">
      @for (group of navGroups; track group.item.key) {
        <li class="navbar__link-item"
            [class.navbar__dropdown-wrap]="group.children.length">

          <!-- Top-level item (no children) -->
          @if (!group.children.length) {
            <button class="navbar__link" (click)="navigate(group.item)" type="button">
              @if (group.item.icon) {
                <span class="navbar__link-icon">{{ group.item.icon }}</span>
              }
              {{ group.item.label }}
            </button>
          }

          <!-- Top-level item WITH children (dropdown parent) -->
          @if (group.children.length) {
            <button class="navbar__link navbar__link--parent"
                    (click)="toggleDropdown(group.item.key, $event)"
                    type="button">
              @if (group.item.icon) {
                <span class="navbar__link-icon">{{ group.item.icon }}</span>
              }
              {{ group.item.label }}
              <span class="navbar__chevron"
                    [class.navbar__chevron--open]="openDropdown === group.item.key">▾</span>
            </button>

            <!-- Dropdown menu (children only) -->
            <ul class="navbar__dropdown"
                [class.navbar__dropdown--open]="openDropdown === group.item.key">
              @for (child of group.children; track child.key) {
                <li>
                  <button class="navbar__dropdown-link" (click)="navigate(child)" type="button">
                    @if (child.icon) {
                      <span class="navbar__dropdown-icon">{{ child.icon }}</span>
                    }
                    {{ child.label }}
                  </button>
                </li>
              }
            </ul>
          }
        </li>
      }
    </ul>

    <div class="navbar__actions">
      @if (phone) {
        <a [href]="'tel:' + phone" class="navbar__cta" id="navbar-phone-cta">
          <span class="navbar__cta-icon">📞</span>
          {{ phone }}
        </a>
      }
    </div>

    <button
      class="navbar__burger"
      [class.navbar__burger--open]="menuOpen"
      (click)="toggleMenu()"
      aria-label="Toggle menu"
      id="navbar-burger"
      type="button">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</nav>
