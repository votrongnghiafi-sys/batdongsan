<section class="hero" id="section-hero" *ngIf="hero">
  <!-- Background -->
  <div class="hero__bg">
    <div class="hero__bg-image" [style.background-image]="bgStyle"></div>
    <div class="hero__bg-overlay"></div>
    <div class="hero__bg-particles"></div>
  </div>

  <!-- Content -->
  <div class="hero__content">
    <div class="hero__badge">
      <span class="hero__badge-dot"></span>
      {{ statusLabel }}
    </div>

    <h1 class="hero__title">{{ hero.title }}</h1>
    <p class="hero__subtitle">{{ hero.subtitle }}</p>

    <p class="hero__location" *ngIf="location">
      <span class="hero__location-icon">📍</span>
      {{ location }}
    </p>

    <div class="hero__actions">
      <button
        class="hero__cta hero__cta--primary"
        (click)="scrollToContact()"
        id="hero-cta-register"
        type="button">
        {{ hero.ctaText || 'Đăng ký tư vấn' }}
      </button>
      <a
        *ngIf="ctaPhone"
        [href]="'tel:' + ctaPhone"
        class="hero__cta hero__cta--secondary"
        id="hero-cta-phone">
        📞 Gọi ngay
      </a>
    </div>

    <div class="hero__stats" *ngIf="hasStats">
      <div class="hero__stat" *ngIf="stat1Value">
        <span class="hero__stat-value">{{ stat1Value }}</span>
        <span class="hero__stat-label">{{ stat1Label }}</span>
      </div>
      <div class="hero__stat-divider" *ngIf="stat1Value && stat2Value"></div>
      <div class="hero__stat" *ngIf="stat2Value">
        <span class="hero__stat-value">{{ stat2Value }}</span>
        <span class="hero__stat-label">{{ stat2Label }}</span>
      </div>
      <div class="hero__stat-divider" *ngIf="stat2Value && stat3Value"></div>
      <div class="hero__stat" *ngIf="stat3Value">
        <span class="hero__stat-value">{{ stat3Value }}</span>
        <span class="hero__stat-label">{{ stat3Label }}</span>
      </div>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="hero__scroll">
    <div class="hero__scroll-line"></div>
  </div>
</section>
